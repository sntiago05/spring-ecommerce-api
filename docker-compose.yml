services:
  postgres:
    image: postgres:16
    container_name: ecommerce-api
    environment:
      POSTGRES_DB: ecommercedb
      POSTGRES_USER: santiago
      POSTGRES_PASSWORD: santiago123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
volumes:
   postgres_data:
